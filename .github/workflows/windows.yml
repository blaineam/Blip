# Blip for Windows: format, lint, test (including live checks of every Windows-native source,
# as the runner's standard user) and build on x64 and ARM64 for every change to desktop/.
# Pushing (or dispatching at) a `windows-v*` tag also publishes both builds as a GitHub release;
# the Mac release.yml only listens for `v*` tags, so the two never collide.
name: Windows

on:
  push:
    branches: [main]
    tags: ['windows-v*']   # path filters are not evaluated for tag pushes
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch: {}   # dispatch at a windows-v* tag ref when the tagged commit carries [ci skip]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustup component add clippy rustfmt

      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: bash
        # Baked into the exe so the installer can tell one preview from the next.
        run: echo "BLIP_VERSION=${GITHUB_REF_NAME#windows-v}" >> "$GITHUB_ENV"

      - name: Strings are current
        run: python tools/gen_strings.py && git diff --exit-code -- crates/core/src/strings.rs

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --target ${{ matrix.target }} -- --nocapture --test-threads 1

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }} -p blip-desktop

      - name: Smoke-test the CLI
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/release/blip-cli.exe
          $exe --version
          $exe metric cpu.usage
          $exe metric memory.usage --raw
          $exe ping 127.0.0.1 --count 2
          $exe snapshot --json > snapshot.json && test -s snapshot.json
          $exe bench --quick
          $exe disktest --size 128
          ls -l target/${{ matrix.target }}/release/*.exe

      # The app must start: unit and live tests can't catch a startup crash (preview.1 shipped
      # one). A runner without OpenGL 2 may fail to create the renderer, which is printed but
      # tolerated; any panic fails the build.
      - name: Launch the tray app and print its log
        shell: pwsh
        env:
          BLIP_DATA_DIR: ${{ runner.temp }}\blip-launch
          BLIP_NO_DIALOG: '1'
        run: |
          $p = Start-Process -PassThru "target/${{ matrix.target }}/release/Blip.exe" -ArgumentList '--portable','--show' -RedirectStandardError "$env:RUNNER_TEMP\blip-stderr.txt"
          Start-Sleep 15
          if ($p.HasExited) { "Blip EXITED with code $($p.ExitCode)" } else { "Blip is still running after 15 s"; Stop-Process -Id $p.Id -Force }
          "--- blip.log"; Get-Content "$env:BLIP_DATA_DIR\blip.log" -ErrorAction SilentlyContinue
          "--- stderr"; Get-Content "$env:RUNNER_TEMP\blip-stderr.txt" -ErrorAction SilentlyContinue
          if (Select-String -Path "$env:BLIP_DATA_DIR\blip.log" -Pattern 'crash:' -Quiet) { throw "Blip panicked at startup" }

      - name: Install / uninstall round trip (standard user)
        shell: pwsh
        env:
          # Without a GPU the installed copy can't open its window; don't let the error box
          # keep that process alive through the uninstall.
          BLIP_NO_DIALOG: '1'
        run: |
          $exe = "target/${{ matrix.target }}/release/Blip.exe"
          (Start-Process -PassThru $exe -ArgumentList '--install').WaitForExit()  # not -Wait: that also waits for the Blip it launches
          Start-Sleep 3
          $dir = "$env:LOCALAPPDATA\Programs\Blip"
          if (!(Test-Path "$dir\Blip.exe") -or !(Test-Path "$dir\blip-cli.exe")) { throw "exes not copied" }
          $u = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Blip'
          "Installed $($u.DisplayVersion) at $($u.InstallLocation); uninstall: $($u.UninstallString)"
          if ((Get-ItemProperty HKCU:\Environment).Path -notlike "*Programs\Blip*") { throw "not on the user PATH" }
          if (!(Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Blip.lnk")) { throw "no Start menu shortcut" }
          if (!((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Blip -like "*Programs\Blip\Blip.exe*")) { throw "no login entry" }
          & "$dir\blip-cli.exe" --version
          # Runners may lack OpenGL 2 for the window; the install itself doesn't need it.
          if (Get-Process Blip -ErrorAction SilentlyContinue) { "installed copy is running" } else { "installed copy didn't stay up (no GPU on the runner)" }
          (Start-Process -PassThru "$dir\Blip.exe" -ArgumentList '--uninstall','--quiet').WaitForExit()
          # The exe can't delete itself: a hidden cmd removes the folder ~2 s after it exits.
          Start-Sleep 8
          if (Get-Process Blip -ErrorAction SilentlyContinue) { throw "Blip still running after uninstall" }
          if (Test-Path "$dir\Blip.exe") { throw "files left behind" }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Blip') { throw "Settings › Apps entry left" }
          if ((Get-ItemProperty HKCU:\Environment).Path -like "*Programs\Blip*") { throw "PATH entry left" }
          if ((Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').Blip) { throw "login entry left" }
          "round trip OK"

      - uses: actions/upload-artifact@v4
        with:
          name: Blip-windows-${{ matrix.target }}
          path: |
            desktop/target/${{ matrix.target }}/release/Blip.exe
            desktop/target/${{ matrix.target }}/release/blip-cli.exe
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/windows-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Package
        run: |
          cd dist
          for d in Blip-windows-*; do
            arch=x64; case "$d" in *aarch64*) arch=arm64;; esac
            (cd "$d" && zip -9 "../Blip-${GITHUB_REF_NAME#windows-v}-windows-$arch.zip" Blip.exe blip-cli.exe)
          done
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # A tag with a suffix (windows-v2.2.0-preview.1) is a prerelease; a plain windows-v2.1.0 is
      # a full release. Neither may become GitHub's "Latest": the Mac app, README and website
      # download Blip.dmg and BlipHelper.dmg through releases/latest.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=desktop/RELEASE_NOTES.md
          ver=${GITHUB_REF_NAME#windows-v}
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt --clobber
          else
            kind=(); title="Blip for Windows $ver"
            case "$ver" in *-*) kind=(--prerelease); title="$title (preview)";; esac
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
              "${kind[@]}" --latest=false --verify-tag --title "$title" --notes-file "$notes"
          fi
