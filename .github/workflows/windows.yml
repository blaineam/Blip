# Blip for Windows: format, lint, test (including live checks of every Windows-native source,
# as the runner's standard user) and build on x64 and ARM64 for every change to desktop/.
# Release builds are attached to GitHub Releases by release.yml.
name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
          rustup component add clippy rustfmt

      - name: Strings are current
        run: python tools/gen_strings.py && git diff --exit-code -- crates/core/src/strings.rs

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --target ${{ matrix.target }} -- --nocapture --test-threads 1

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }} -p blip-desktop

      - name: Smoke-test the CLI
        shell: bash
        run: |
          exe=target/${{ matrix.target }}/release/blip-cli.exe
          $exe --version
          $exe metric cpu.usage
          $exe metric memory.usage --raw
          $exe ping 127.0.0.1 --count 2
          $exe snapshot --json > snapshot.json && test -s snapshot.json
          $exe bench --quick
          $exe disktest --size 128
          ls -l target/${{ matrix.target }}/release/*.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Blip-windows-${{ matrix.target }}
          path: |
            desktop/target/${{ matrix.target }}/release/Blip.exe
            desktop/target/${{ matrix.target }}/release/blip-cli.exe
          retention-days: 14
