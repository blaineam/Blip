# Cut a release from the Actions dialog (ported from Haven).
#   version: X.Y.Z → full release: notarized DMG on GH + Mac App Store submit
#   rc: N          → vX.Y.Z-rc.N: prerelease DMG only (TestFlight already has every push)
# The tag is pushed with the default token (which never auto-triggers workflows), then each
# pipeline is dispatched AT THE TAG REF so ref_type=='tag' logic behaves as a hand-pushed tag.
name: cut-release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z (stamped into both Info.plists if not already)"
        required: true
      rc:
        description: "RC number — leave empty for a full release"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Validate + stamp + tag
        id: cut
        env:
          V: ${{ inputs.version }}
          RC: ${{ inputs.rc }}
        run: |
          set -euo pipefail
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must be X.Y.Z"; exit 1; }
          [[ -z "$RC" || "$RC" =~ ^[0-9]+$ ]] || { echo "::error::rc must be a number"; exit 1; }
          TAG="v$V"; [ -n "$RC" ] && TAG="v$V-rc.$RC"
          git rev-parse -q --verify "refs/tags/$TAG" >/dev/null && { echo "::error::$TAG already exists"; exit 1; }
          if [ -z "$RC" ]; then
            NOTES=$(awk '/^## whats_new$/{f=1;next} /^## /{f=0} f&&NF{print;exit}' appstore-metadata.md)
            [[ "$NOTES" == "$V"* ]] || { echo "::error::appstore-metadata.md whats_new starts with '$NOTES' — write the $V notes first"; exit 1; }
          fi
          python3 - <<PY
          import plistlib
          for p in ('Blip/Resources/Info.plist', 'BlipHelper/Resources/Info.plist'):
              d = plistlib.load(open(p, 'rb'))
              d['CFBundleShortVersionString'] = "$V"
              plistlib.dump(d, open(p, 'wb'))
              print('stamped', p)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A && git commit -m "release: stamp $V (cut-release dialog)" && git push origin HEAD:main
          fi
          git tag "$TAG" && git push origin "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Fan out pipelines at the tag ref
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cut.outputs.tag }}
          RC: ${{ inputs.rc }}
          V: ${{ inputs.version }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref "refs/tags/$TAG"
          gh workflow run apple-store.yml --ref "refs/tags/$TAG"
          # rc tags run apple-store in TestFlight-only mode; full tags submit for review.
