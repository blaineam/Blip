# Blip for Linux: format, lint, test (including live checks of every Linux source as an ordinary
# user), offscreen renders, a GUI launch under Xvfb, and portable builds against glibc 2.28 for
# x64, arm64 and armv7 — then each build is run inside Rocky Linux 8, Ubuntu, Debian and Arch
# containers to prove one binary covers them. Pushing (or dispatching at) a `linux-v*` tag also
# publishes the tarballs as a GitHub prerelease; the Mac release.yml only listens for `v*` tags.
name: Linux

on:
  push:
    branches: [main]
    tags: ['linux-v*']   # path filters are not evaluated for tag pushes
    paths:
      - 'desktop/**'
      - '.github/workflows/linux.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/linux.yml'
  workflow_dispatch: {}   # dispatch at a linux-v* tag ref when the tagged commit carries [ci skip]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            target: x86_64-unknown-linux-gnu
            distros: rockylinux:8 ubuntu:20.04 debian:11 archlinux:latest fedora:41
          - runner: ubuntu-24.04-arm
            arch: arm64
            target: aarch64-unknown-linux-gnu
            distros: rockylinux:8 debian:12 ubuntu:24.04
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v5

      - name: Rust toolchain
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }} armv7-unknown-linux-gnueabihf
          rustup component add clippy rustfmt

      - name: System packages and zig
        run: |
          sudo apt-get update -qq
          # Xvfb + a software GL/Vulkan stack for the GUI launch and the offscreen renders.
          # (libxkbcommon-x11 is on every X11 desktop; bare runners lack it.)
          sudo apt-get install -y -qq xvfb dbus-x11 mesa-vulkan-drivers libgl1-mesa-dri libegl1 libxkbcommon-x11-0 fonts-dejavu-core >/dev/null
          pip3 install --break-system-packages --quiet ziglang cargo-zigbuild

      - name: Strings are current
        run: python3 tools/gen_strings.py && git diff --exit-code -- crates/core/src/strings.rs

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test (live sources + offscreen renders)
        env:
          BLIP_SHOTS_DIR: ${{ github.workspace }}/shots
        run: dbus-run-session -- cargo test --locked --workspace -- --nocapture --test-threads 1

      - name: Build portable release (glibc 2.28)
        run: |
          cargo zigbuild --release --locked --target ${{ matrix.target }}.2.28 -p blip-desktop
          if [ "${{ matrix.arch }}" = x64 ]; then
            cargo zigbuild --release --locked --target armv7-unknown-linux-gnueabihf.2.28 -p blip-desktop
          fi
          for f in target/*/release/Blip target/*/release/blip-cli; do
            echo "$f: $(stat -c %s "$f") bytes"
            readelf -d "$f" | grep NEEDED
            # Nothing newer than glibc 2.28 may be referenced (Rocky/RHEL 8).
            newest=$(readelf -W --version-info "$f" | grep -oE 'GLIBC_2\.[0-9]+' | sort -t. -k2 -n | tail -1)
            echo "  newest symbol version: $newest"
            if [ "${newest#GLIBC_2.}" -gt 28 ]; then echo "::error::$f needs $newest"; exit 1; fi
          done

      - name: Smoke-test the CLI
        run: |
          exe=target/${{ matrix.target }}/release/blip-cli
          $exe --version
          $exe metric cpu.usage
          $exe metric memory.usage --raw
          $exe ping 127.0.0.1 --count 2
          $exe snapshot --json > snapshot.json && test -s snapshot.json
          $exe bench --quick
          $exe disktest --size 128

      - name: Launch the tray app under Xvfb
        run: |
          # No tray host here, so Blip must come up as a window and keep running.
          set +e
          xvfb-run -a dbus-run-session -- timeout 10 target/${{ matrix.target }}/release/Blip --show
          status=$?
          echo "exit $status (124 = still running when timeout stopped it)"
          test $status -eq 124

      - name: Run on other distros
        run: |
          exe=target/${{ matrix.target }}/release/blip-cli
          for img in ${{ matrix.distros }}; do
            echo "::group::$img"
            docker run --rm -v "$PWD/$exe:/blip-cli:ro" "$img" sh -c \
              'cat /etc/os-release | head -2 && ldd --version | head -1 && /blip-cli --version && /blip-cli metric cpu.usage && /blip-cli snapshot --json | head -c 300 && echo'
            echo "::endgroup::"
          done

      - name: Package
        run: |
          case "$GITHUB_REF" in
            refs/tags/linux-v*) ver=${GITHUB_REF_NAME#linux-v} ;;
            *) ver=dev-${GITHUB_SHA::7} ;;
          esac
          mkdir -p dist
          pack() {
            dir=Blip-$ver-linux-$2
            mkdir -p "pkg/$dir/icons"
            cp target/$1/release/Blip target/$1/release/blip-cli linux/install.sh linux/com.blainemiller.Blip.desktop "pkg/$dir/"
            cp linux/icons/*.png "pkg/$dir/icons/"
            cp linux/README.txt "pkg/$dir/README.txt"
            tar -C pkg -czf "dist/$dir.tar.gz" "$dir"
          }
          pack ${{ matrix.target }} ${{ matrix.arch }}
          if [ "${{ matrix.arch }}" = x64 ]; then pack armv7-unknown-linux-gnueabihf armv7; fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: Blip-linux-${{ matrix.arch }}
          path: desktop/dist/*.tar.gz
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renders-linux-${{ matrix.arch }}
          path: shots/
          if-no-files-found: ignore
          retention-days: 7

  prerelease:
    if: startsWith(github.ref, 'refs/tags/linux-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          pattern: Blip-linux-*
          merge-multiple: true
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS.txt \
              --prerelease --latest=false --verify-tag \
              --title "Blip for Linux ${GITHUB_REF_NAME#linux-v} (preview)" \
              --notes-file desktop/linux/RELEASE_NOTES.md
          fi
