# Project overrides for ../_shared/update-screenshots.sh
# zsh-sourced — same syntax as a shell script.
#
# CAPTURE_CMD refreshes the iOS/iPadOS raws (simulator rig). The mac raws are
# captured separately by Tools/screenshots.sh (the menu-bar/popover rig) and
# re-framed from disk here — use --only-device to scope a run.

CAPTURE_CMD="./Tools/capture_screenshots.sh"
SCREENSHOTS_DIR="docs/appstore-screenshots"
BUNDLE_ID="com.blainemiller.Blip"

# One entry per device: "<rawKey>|<.monkr path>|<ASC display type>"
#   6.9" iPhone canvas (1320×2868) → APP_IPHONE_67
#   13"  iPad canvas   (2064×2752) → APP_IPAD_PRO_3GEN_129
#   Mac canvas         (2880×1800) → APP_DESKTOP (uploads to the MAC_OS version)
DEVICES=(
  "iphone-6.9|docs/appstore-screenshots/Blip-iphone.monkr|APP_IPHONE_67"
  "ipad-13|docs/appstore-screenshots/Blip-ipad.monkr|APP_IPAD_PRO_3GEN_129"
  "mac|docs/appstore-screenshots/Blip-mac.monkr|APP_DESKTOP"
)
