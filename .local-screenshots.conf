# Rocket screenshots config (rocket init-shots)
CAPTURE_CMD="./Tools/screenshots.sh"
# Tools/screenshots.sh writes canonical 2880x1800 captures to
# docs/appstore-screenshots/mac (its raw/ subdir is ignored by the renderer).
SCREENSHOTS_DIR="docs/appstore-screenshots"
BUNDLE_ID="com.blainemiller.Blip"
PLATFORM="MAC_OS"
DEVICES=(
  "mac|docs/appstore-screenshots/Blip-mac.monkr|APP_DESKTOP"
)
