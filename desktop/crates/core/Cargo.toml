[package]
name = "blip-core"
description = "Blip's platform-neutral core: models, formatting, BenchKit, speed test, traceroute stats, settings and strings."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
lzfse_rust = "0.2"
rustfft = "6"
maxminddb = "0.33"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
ureq = { workspace = true, features = ["native-tls"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]
