[package]
name = "blip-platform"
description = "Blip's metric sources: native Win32 on Windows and /proc, /sys and D-Bus on Linux, all without admin."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
blip-core.workspace = true
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk", "network", "component", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
png = "0.18"
# D-Bus: UDisks2 (drive SMART), NetworkManager (Wi-Fi, metered), logind + the desktop portal
# (Keep Awake), power-profiles-daemon. Already in the graph through the tray's ksni backend.
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
# X11 work area, idle time and the mouse jiggle (XTest) — pure Rust, no libX11 needed.
x11rb = { version = "0.13", default-features = false, features = ["xtest", "screensaver"] }
# Blip Bench's GPU leg: Vulkan (or GLES 3.1) compute.
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "gles", "wgsl"] }
pollster = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
libc = "0.2"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "vulkan", "wgsl"] }
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Globalization",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_NetworkManagement_WiFi",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_LibraryLoader",
    "Win32_System_Performance",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Networking_Connectivity",
]
