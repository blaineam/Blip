[package]
name = "blip-android"
description = "Blip for Android's native core: BenchKit, speed and disk tests, ping/traceroute, GeoIP and the Markdown export, shared with Windows and Linux, over JNI."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "blip_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
blip-core.workspace = true
blip-platform.workspace = true
serde_json.workspace = true
jni = { version = "0.21", default-features = false }
