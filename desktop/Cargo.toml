# Blip for Windows (and, later, Linux): a Rust workspace.
#
#   crates/core      platform-neutral logic — models, formatting, BenchKit, speed test, traceroute
#                    stats, GeoIP, settings, strings. Unit-tested on every host.
#   crates/platform  the metric sources behind one `Platform` trait: native Win32 on Windows,
#                    a portable fallback elsewhere (the seed of the Linux backend).
#   app              the tray app itself (egui), plus the `blip` command line.
[workspace]
resolver = "2"
members = ["crates/core", "crates/platform"]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
blip-core = { path = "crates/core" }
blip-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls", "gzip"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
