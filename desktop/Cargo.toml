# Blip for Windows and Linux: a Rust workspace.
#
#   crates/core      platform-neutral logic — models, formatting, BenchKit, speed test, traceroute
#                    stats, GeoIP, settings, strings. Unit-tested on every host.
#   crates/platform  the metric sources: native Win32 on Windows, /proc + /sys + D-Bus on Linux,
#                    over a portable sysinfo base.
#   app              the tray app itself (egui), plus the `blip` command line.
[workspace]
resolver = "2"
members = ["crates/core", "crates/platform", "app"]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
blip-core = { path = "crates/core" }
blip-platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Windows uses the OS TLS stack (SChannel); Linux bundles rustls so one binary runs on any distro
# regardless of its OpenSSL version (Rocky 8 ships 1.1, Ubuntu 24.04 ships 3).
ureq = { version = "3", default-features = false, features = ["gzip"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
